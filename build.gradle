// プラグインのバージョンはここで1回だけ宣言し、各サブプロジェクトはバージョンなしで適用する
plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'com.diffplug.spotless' version '8.10.3' apply false
    id 'com.github.spotbugs' version '6.5.12' apply false
    id 'com.github.jk1.dependency-license-report' version '3.1.4' apply false
}

import com.github.jk1.license.render.TextReportRenderer
import com.github.spotbugs.snom.Confidence

// 各サブプロジェクト共通の設定だけを置く。サブプロジェクト固有の設定は各ディレクトリのbuild.gradleに書く
subprojects {
    group = 'dbxray'
    // 版の出所はここだけ。リリースのタグ（v0.1.0等）はこの値と一致しなければならない（release.ymlが照合する）。
    // 版の上げ方はCONTRIBUTING.mdの「バージョンとリリース」を参照
    version = '0.4.1'

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'com.github.jk1.dependency-license-report'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test) {
        useJUnitPlatform()
        testLogging {
            exceptionFormat = 'full'
            showExceptions = true
            showCauses = true
            showStackTraces = true
            events 'failed'
        }
    }

    javadoc {
        options.charSet = 'UTF-8'
        options.encoding = 'UTF-8'
        // 壊れたJavadoc（タグの誤り・参照先の無いリンク等）は検知するが、Javadocを書かないメンバーは
        // docs/development/coding-guidelines.mdの「コメント・Javadoc」で許しているため、記述漏れ（missing）は検査しない
        options.addBooleanOption('Xdoclint:all,-missing', true)
    }

    spotless {
        java {
            // Javadocは整形しない。整形は日本語の文を1段落に詰め直し、行の継ぎ目に半角空白を入れ、
            // {@link}・{@code}を行末で割るため。Javadocの折り返しは手で行う（docs/development/coding-guidelines.md）
            googleJavaFormat('1.27.0').skipJavadocFormatting()
            // static importを第1グループ、それ以外をASCII辞書順の1グループとする
            importOrder('\\#', '')
            removeUnusedImports()
        }
    }

    // 静的解析でバグを検出する。誤検知で開発を妨げないよう、確度が高い（HIGH）指摘だけを失敗として扱う。
    // 検査の対象は配布するコード（main）で、テストコード・結合テストのコードは対象にしない。
    // 指摘を除外するときは、コードを直せない理由を添えてgradle/spotbugs/exclude.xmlに書く（検査自体は緩めない）
    spotbugs {
        reportLevel = Confidence.valueOf('HIGH')
        excludeFilter = rootProject.file('gradle/spotbugs/exclude.xml')
    }
    tasks.matching { it.name.startsWith('spotbugs') && it.name != 'spotbugsMain' }.configureEach {
        enabled = false
    }

    // 配布物（jar）に同梱する依存ライブラリのライセンスの一覧。release.ymlが配布用zipへ入れる
    licenseReport {
        configurations = ['runtimeClasspath']
        renderers = [new TextReportRenderer('THIRD-PARTY-NOTICES.txt')]
    }
}
