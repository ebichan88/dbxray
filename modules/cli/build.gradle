plugins {
    id 'jacoco'
    id 'com.gradleup.shadow'
}

// 結合テスト（Docker上の実DBに対してmapperのSQLと出力全体を検証する）は、Dockerが無い環境でも
// 単体テスト（test）を実行できるよう、別のソースセット・タスクに分ける
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.mybatis:mybatis:3.5.19'
    implementation 'org.postgresql:postgresql:42.7.13'
    // Java 11以降向けのojdbc11を使う。23系のドライバはDB 19c以上にしか対応せず、READMEの対象（Oracle 12c以上）を外れるため21系に留める
    implementation 'com.oracle.database.jdbc:ojdbc11:21.23.0.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.26.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.26.1'
    implementation group: 'com.google.inject', name: 'guice', version: '7.0.0'
    // Guice固有の@Injectではなく標準のjakarta.injectを用い、ドメイン層をDIコンテナ実装から切り離す
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    // レイヤーの依存方向・命名等、docs/development/coding-guidelines.mdの規約のうち機械的に判定できるものをArchitectureTestで検査する
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    // 結合テスト（integrationTest・oracleIntegrationTest）だけが使う。Docker上に使い捨てのDBを起動する
    integrationTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
    integrationTestImplementation 'org.testcontainers:testcontainers-oracle-free'
}

test {
    // 5MB程度の本体を字句に分けるテストは、字句が百万個を超えてメモリを使うため、Gradleの既定（512MB）に頼らず余裕を持たせる
    maxHeapSize = '1g'
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

// 単体テスト（DB不要）のカバレッジのみを対象とする。結合テストはmapperのSQLと出力全体の
// 突き合わせが目的で、Dockerが無い環境では実行できないため、カバレッジ基準には含めない
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// ドメイン層（ルールを持つ中心的なロジック）のみ、単体テストのカバレッジに最低基準を設ける。
// domain以外の層（インフラのDB/ファイルI/O等）は結合テストや手動確認で担保するため対象外。
// 現状の実績（line 99%・branch 95%超）を下回ったら気づけるよう、実績より少し低い値を基準にする
jacocoTestCoverageVerification {
    dependsOn test
    // 対象のパッケージは検査するクラスの範囲で絞る。BUNDLEのincludesはクラスではなくバンドル（プロジェクト）名に
    // 照合されるため、クラスのパターンを書くとルールがどのクラスにも当てはまらず、基準を下回っても失敗しない
    classDirectories.setFrom(sourceSets.main.output.classesDirs.collect {
        fileTree(it) { include 'com/dbxray/domain/**' }
    })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a disposable PostgreSQL on Docker (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'oracle'
    }
    shouldRunAfter tasks.named('test')
}

// Oracleのコンテナはイメージが大きく（約1.3GB）メモリも2GB程度使うため、PostgreSQLの結合テストとは別のタスクに分ける
tasks.register('oracleIntegrationTest', Test) {
    description = 'Runs integration tests against a disposable Oracle Database Free on Docker (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'oracle'
    }
    shouldRunAfter tasks.named('test')
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.dbxray.Dbxray',
            // --versionの表示元（実行時にManifestから読む）。shadowJarもこのmanifestを引き継ぐ
            'Implementation-Version': project.version
        )
    }
}

// 依存ライブラリを含まないjarは単体では起動できない。shadowJarと名前が分かれた今は取り違えのもとになるため作らない
// （manifestの設定はshadowJarが引き継ぐ）
jar {
    enabled = false
}

tasks.named('build').configure {
    dependsOn(tasks.named('shadowJar'))
}

// 配布物・README・release.ymlが参照するjar名を、サブプロジェクト名（cli）に関わらず保つ
base {
    archivesName = 'dbxray'
}

shadowJar {
    // 起動スクリプト・CIのジョブ等に書くパスが版を上げるたびに変わらないよう、版を含めない固定名にする（版は--versionで確かめる）
    archiveFileName = 'dbxray.jar'
}

task copyResources(type: Copy) {
    from 'src/main/resources/conf'
    into "$buildDir/../build/libs/conf"
}

build.dependsOn(copyResources)
