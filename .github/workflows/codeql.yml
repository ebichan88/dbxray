name: CodeQL

# GitHubのコードスキャン（CodeQL）で、SQLインジェクション・パス・トラバーサル・安全でないパース等の
# 脆弱性のパターンを検出する。結果はリポジトリのSecurityタブ（Code scanning）に出る。
# 週1回も実行するのは、コードを変えなくても、検出ルールの更新で新しく見つかるものを拾うため
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      # 配布するコードとテストコードをコンパイルする（CodeQLはこのビルドを観測して解析する）。テストの実行はしない
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava compileTestJava compileIntegrationTestJava --console=plain

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:java-kotlin
