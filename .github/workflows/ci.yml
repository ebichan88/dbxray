name: CI

# PRごとに、単体テスト・フォーマットの検査（build）と、Docker上の実DBに対する結合テスト（integrationTest・oracleIntegrationTest）を行う。
# docs/sample配下（DDL・ベースライン）は結合テストの入力のため、docsの変更でも実行する。
# release.ymlも、リリースの前にこのワークフローを呼び出し、テストに通った場合だけ配布物を作る
on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    # 結合テストはDockerを使うため、Dockerが使えるLinuxのランナーで実行する
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      # build（test含む）の中で、cliのドメイン層・mcp-serverのcatalogのカバレッジが各build.gradleに定めた基準を下回ると
      # jacocoTestCoverageVerificationが失敗し、buildごと失敗する。
      # javadocは、doclintで壊れたJavadoc（タグの誤り・参照先の無いリンク等）を検知するために実行する。
      # generateLicenseReportは、release.ymlが配布物に入れるライセンスの一覧を作れなくなっていないかを、マージ前に確かめるために実行する
      - name: Build and run tests
        run: |
          chmod +x ./gradlew
          ./gradlew build javadoc integrationTest generateLicenseReport --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            modules/cli/build/reports/tests/
            modules/mcp-server/build/reports/tests/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: |
            modules/cli/build/reports/jacoco/test/html/
            modules/mcp-server/build/reports/jacoco/test/html/

      # PRに単体テストのカバレッジをコメントする。
      # forkからのPRはGITHUB_TOKENが読み取り専用で投稿が失敗し、ジョブごと赤になるため実行しない（カバレッジはアーティファクトで見られる）
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: modules/cli/build/reports/jacoco/test/jacocoTestReport.xml,modules/mcp-server/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: カバレッジレポート（単体テスト）
          update-comment: true

  # Oracleの結合テストはイメージ（約1.3GB）の取得とDBの起動に時間がかかるため、別のジョブで並行して実行する
  oracle-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle

      - name: Run Oracle integration tests
        run: |
          chmod +x ./gradlew
          ./gradlew :cli:oracleIntegrationTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-test-reports
          path: modules/cli/build/reports/tests/oracleIntegrationTest/
