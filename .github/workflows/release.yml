name: Release

# v*タグ（v0.1.0等）のpushで、そのタグの版のGitHub Releaseを作る。
# タグとbuild.gradleの版が一致し、CI（単体テスト・結合テスト）に通った場合だけ、配布用zipを作って添付する
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # --version・MCPのserverInfo.versionはbuild.gradleの版を表示するため、タグと食い違ったまま配布しない
      - name: Check that the tag matches the version in build.gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          version=$(./gradlew -q :cli:properties --console=plain | sed -n 's/^version: //p')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ（${GITHUB_REF_NAME}）とbuild.gradleの版（${version}）が一致しません。build.gradleのversionを上げたコミットにタグを付けてください。"
            exit 1
          fi

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    # 呼び出す側が渡した権限までしか使えないため、ci.ymlが宣言している権限を渡す（PRへのコメントはタグのpushでは実行されない）
    permissions:
      contents: read
      pull-requests: write

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: dbxray-windows.zip
          - os: ubuntu-latest
            platform: linux
            archive: dbxray-linux.zip
          - os: macos-latest
            platform: macos
            archive: dbxray-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradlew実行前に、gradle-wrapper.jarがGradle公式のものか（PRで差し替えられていないか）をチェックサムで確かめる
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: gradlew.bat build generateLicenseReport

      - name: Build with Gradle (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build generateLicenseReport

      # 依存ライブラリ（JDBCドライバ、log4j、MCPのSDK等）が実際に使用するJDKモジュールを検出する。
      # cliとMCPサーバーで同梱のJava実行環境（runtime）を共有するため、両方のjarを渡して必要なモジュールを合算する。
      # jdk.crypto.ec / jdk.charsets / jdk.unsupported はリフレクションやSPI経由で使われ
      # jdeps検出から漏れやすいため明示的に追加する（jdk.charsetsは日本語(Shift_JIS等)の
      # 文字コード対応に必須）。
      - name: Detect required JDK modules (Windows)
        if: matrix.platform == 'windows'
        id: jdeps_windows
        shell: pwsh
        run: |
          $jars = @("modules/cli/build/libs/dbxray.jar", "modules/mcp-server/build/libs/dbxray-mcp.jar")
          $detected = (& "$env:JAVA_HOME\bin\jdeps.exe" --ignore-missing-deps --print-module-deps --multi-release 21 @jars | Select-Object -Last 1).Trim()
          $modules = "$detected,jdk.crypto.ec,jdk.charsets,jdk.unsupported"
          Write-Host "Required modules: $modules"
          "modules=$modules" >> $env:GITHUB_OUTPUT

      - name: Detect required JDK modules (Unix)
        if: matrix.platform != 'windows'
        id: jdeps_unix
        shell: bash
        run: |
          jars=("modules/cli/build/libs/dbxray.jar" "modules/mcp-server/build/libs/dbxray-mcp.jar")
          detected=$("$JAVA_HOME/bin/jdeps" --ignore-missing-deps --print-module-deps --multi-release 21 "${jars[@]}" | tail -1 | tr -d '\r')
          modules="$detected,jdk.crypto.ec,jdk.charsets,jdk.unsupported"
          echo "Required modules: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

      - name: Prepare release folder
        shell: bash
        run: mkdir -p release

      - name: Build custom Java runtime (jlink) (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules "${{ steps.jdeps_windows.outputs.modules }}" `
            --strip-debug --no-header-files --no-man-pages --compress=2 `
            --output release/runtime

      - name: Build custom Java runtime (jlink) (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          "$JAVA_HOME/bin/jlink" \
            --module-path "$JAVA_HOME/jmods" \
            --add-modules "${{ steps.jdeps_unix.outputs.modules }}" \
            --strip-debug --no-header-files --no-man-pages --compress=2 \
            --output release/runtime

      # MITの条件である著作権表示（LICENSE）と、jarに同梱した依存ライブラリのライセンス（本文・NOTICEを含む）を配布物に入れる。
      # JDKのライセンスは、jlinkがruntime/legalに入れる
      - name: Assemble release package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Copy-Item modules/cli/build/libs/dbxray.jar release/
          Copy-Item -Recurse modules/cli/build/libs/conf release/conf
          Copy-Item README.md release/
          New-Item -ItemType Directory -Force release/docs | Out-Null
          Copy-Item -Recurse docs/usage release/docs/usage
          Copy-Item LICENSE release/
          Copy-Item modules/cli/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/
          Copy-Item scripts/run.bat release/
          New-Item -ItemType Directory -Force release/mcp | Out-Null
          Copy-Item modules/mcp-server/build/libs/dbxray-mcp.jar release/mcp/
          Copy-Item modules/mcp-server/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/mcp/

      - name: Assemble release package (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cp modules/cli/build/libs/dbxray.jar release/
          cp -r modules/cli/build/libs/conf release/conf
          cp README.md release/
          mkdir -p release/docs
          cp -r docs/usage release/docs/usage
          cp LICENSE release/
          cp modules/cli/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/
          cp scripts/run.sh release/
          mkdir -p release/mcp
          cp modules/mcp-server/build/libs/dbxray-mcp.jar release/mcp/
          cp modules/mcp-server/build/reports/dependency-license/THIRD-PARTY-NOTICES.txt release/mcp/
          chmod +x release/run.sh release/runtime/bin/java

      - name: Create ZIP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath ${{ matrix.archive }} -Force

      - name: Create ZIP (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: (cd release && zip -r "../${{ matrix.archive }}" .)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # ダウンロードしたzipが改ざん・破損していないかを、利用者が sha256sum -c で確かめられるようにする
      - name: Create checksums
        shell: bash
        run: |
          mkdir -p dist
          cp artifacts/*/*.zip dist/
          (cd dist && sha256sum *.zip > SHA256SUMS)

      # リリースノートは、マージしたPRをラベルごとに分類した自動生成（.github/release.yml）。
      # .github/release-notes/{タグ}.md があれば、移行の手順等として自動生成の前に載せる。
      # タグに「-」を含む版（v0.2.0-rc.1等）はプレリリースにし、releases/latest（READMEの案内先）の対象から外す
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          args=(--verify-tag --title "${tag}" --generate-notes)
          notes=".github/release-notes/${tag}.md"
          if [ -f "${notes}" ]; then
            args+=(--notes-file "${notes}")
          fi
          if [[ "${tag}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${tag}" dist/*.zip dist/SHA256SUMS "${args[@]}"
